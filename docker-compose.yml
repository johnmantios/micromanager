services:
  database:
    build:
      context: .
      dockerfile: ./database/timescale/Dockerfile
    container_name: timescale-micromanager
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: micromanager
    ports:
      - "55433:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d micromanager"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot migration runner. Waits for the database to accept connections,
  # then applies every migrations/*.up.sql in order (tracked in schema_migrations).
  migrate:
    image: migrate/migrate:v4.17.1
    container_name: micromanager-migrate
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://root:root@database:5432/micromanager?sslmode=disable"
      - "up"

  grafana-db:
    image: postgres:16-alpine
    container_name: grafana-postgres
    restart: always
    environment:
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana
      POSTGRES_DB: grafana
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    build:
      context: .
      dockerfile: ./grafana/Dockerfile
    container_name: grafana
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      grafana-db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: grafana-db:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: grafana
      GF_DATABASE_SSL_MODE: disable
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards