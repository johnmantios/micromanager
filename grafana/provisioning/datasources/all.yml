apiVersion: 1

datasources:
  - name: Micromanager data source
    type: postgres
    access: proxy
    orgId: 1
    uid: micromanager-postgres
    url: database:5432
    user: root
    secureJsonData:
      password: root
    jsonData:
      database: micromanager
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true
      maxOpenConns: 100
      maxIdleConns: 100
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
